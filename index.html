<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Is It Raining?</title>
  <meta name="description" content="Yes or no. That's it. That's the website.">
  <meta name="author" content="Midnight">
  <link rel="author" href="https://midnightmedia.io">
  <meta name="theme-color" content="#f3eee3">

  <!-- Icons and home-screen app -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Raining?">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Link previews (WhatsApp, iMessage, socials) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://isitraining.co.uk/">
  <meta property="og:title" content="Is it raining?">
  <meta property="og:description" content="Yes or no. That's it. That's the website.">
  <meta property="og:image" content="https://isitraining.co.uk/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Is it raining? Yes. Or no. Depends where you are, really.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body data-state="loading">
  <div id="flash" aria-hidden="true"></div>
  <canvas id="rain" aria-hidden="true"></canvas>

  <main>
    <p class="question">Is it raining?</p>
    <h1 id="answer" aria-live="polite">Checking…</h1>
    <p id="quip">Looking out the window.</p>
    <p id="aside"></p>

    <form id="search" hidden>
      <label for="place" class="visually-hidden">Place</label>
      <input id="place" name="place" type="text" placeholder="e.g. Stamford" autocomplete="address-level2" required>
      <button type="submit">Look</button>
    </form>

    <div class="actions">
      <button id="more-btn" class="pill" aria-expanded="false" aria-controls="details" hidden>Fine, tell me more</button>
      <button id="share-btn" class="pill" hidden>Share the news</button>
      <button id="retry-btn" class="pill" hidden>Try again</button>
    </div>

    <section id="details" hidden>
     <div class="details-inner">
      <p class="place" id="d-place"></p>
      <p class="streak" id="d-streak"></p>
      <dl>
        <div><dt>Temperature</dt><dd id="d-temp"></dd></div>
        <div><dt>Feels like</dt><dd id="d-feels"></dd></div>
        <div><dt>Wind</dt><dd id="d-wind"></dd></div>
        <div><dt>Recent rainfall</dt><dd id="d-precip"></dd></div>
      </dl>
      <div class="chart">
        <p class="label" id="d-chart-title">Rest of today</p>
        <p class="verdict" id="d-today"></p>
        <div class="bars" id="d-bars"></div>
        <div class="axis" id="d-axis"></div>
        <p class="tomorrow" id="d-tomorrow"></p>
      </div>
      <p class="meta" id="d-meta"></p>
      <button id="elsewhere" class="linkish" type="button">Check somewhere else</button>
     </div>
    </section>
  </main>

  <footer>
    <p class="install" id="install-line" hidden><button id="install-btn" class="linkish" type="button">Put it on your home screen</button></p>
    <p class="tip" id="tip-line" hidden><a id="tip" href="#" target="_blank" rel="noopener"></a></p>
    <span>Made by <a href="https://midnightmedia.io" rel="noopener">Midnight</a>.</span>
    <span>Weather from <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a>. Attitude, our own.</span>
  </footer>

  <div id="install-hint" role="dialog" aria-modal="false" aria-labelledby="install-title" hidden>
    <p class="install-title" id="install-title">Two taps. Apple insists.</p>
    <p id="install-steps"></p>
    <button id="install-ok" class="pill" type="button">Fine</button>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
